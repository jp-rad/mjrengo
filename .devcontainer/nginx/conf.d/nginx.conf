upstream backend-dev {
    server dev:8002 max_fails=0;
}

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    return 301 https://localhost$request_uri;
}

# HTTPS termination
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    client_max_body_size 100m;

    proxy_read_timeout      600s;
    proxy_connect_timeout   600s;
    proxy_send_timeout      600s;

    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Redirect root path to /console
    location = / {
        return 302 https://localhost/console;
    }

    # =====================================================================
    # BEGIN development-only endpoints: /ca.crt, /oreore, /trustme
    #
    # NOTE: These endpoints are intended for development
    #       and not recommended for production use.
    # =====================================================================

    # Serve the development CA certificate at /ca.crt
    location = /ca.crt {
        alias /etc/nginx/ssl/ca.crt;

        types { application/x-x509-ca-cert crt; }
        default_type application/x-x509-ca-cert;

        add_header Content-Disposition "attachment; filename=dev-root-certificate.crt";
    }

    # Redirect /oreore to /ca.crt
    location = /oreore {
        return 302 /ca.crt;
    }

    # Redirect /trustme to /ca.crt
    location = /trustme {
        return 302 /ca.crt;
    }

    # =====================================================================
    # END development-only endpoints
    # =====================================================================

    # Proxy all other requests to FastAPI backend
    location / {
        proxy_pass http://backend-dev;
        proxy_redirect off;
    }

    # Error pages
    error_page 500 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    error_page 502 /502.html;
    location = /502.html {
        return 502 "<!DOCTYPE HTML PUBLIC \"-//IETF//DTD HTML 2.0//EN\">\n<html><head>\n<title>Backend server is not running</title>\n</head><body>\n<h1>502 Bad Gateway - Backend server is not running</h1>\n<p>Start backend server.</p>\n<hr>\n<address>LB Server at $host Port $server_port</address>\n</body></html>";
    }

    # Common gzip settings
    gzip_types text/css text/scss text/plain text/xml application/xml application/json application/javascript;
    gzip on;
}

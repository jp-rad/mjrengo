name: Build Docs and PEP503 Index

on:
  push:
    tags:
      - "*.*.*"

jobs:
  build-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          pip install --upgrade pip
          pip install pdoc build hatchling

      # ---------------------------------------------------------
      # Build all packages
      # ---------------------------------------------------------
      - name: Build mjrengo
        run: python -m build
        working-directory: mjrengo

      - name: Build mjrengo-data-mj-v6_02_201
        run: python -m build
        working-directory: glyph/mj-v6_02_201

      - name: Build mjrengo-data-mj-v6_02_201_onka
        run: python -m build
        working-directory: glyph/mj-v6_02_201_onka

      - name: Build mjrengo-data-mj_plus-v4_10
        run: python -m build
        working-directory: glyph/mj_plus-v4_10

      - name: Build mjrengo-data-mj_plusx-v1_20
        run: python -m build
        working-directory: glyph/mj_plusx-v1_20

      # ---------------------------------------------------------
      # Collect wheels
      # ---------------------------------------------------------
      - name: Collect wheels
        run: |
          mkdir -p docs/wheels
          cp mjrengo/dist/*.whl docs/wheels/
          cp glyph/mj-v6_02_201/dist/*.whl docs/wheels/
          cp glyph/mj-v6_02_201_onka/dist/*.whl docs/wheels/
          cp glyph/mj_plus-v4_10/dist/*.whl docs/wheels/
          cp glyph/mj_plusx-v1_20/dist/*.whl docs/wheels/

      # ---------------------------------------------------------
      # Generate PEP503 index (echo 方式で安全に生成)
      # ---------------------------------------------------------
      - name: Create PEP503 index
        run: |
          mkdir -p docs/simple

          for whl in docs/wheels/*.whl; do
            fname=$(basename "$whl")
            pkg=$(echo "$fname" | cut -d'-' -f1)

            mkdir -p docs/simple/$pkg

            echo '<!DOCTYPE html>' > docs/simple/$pkg/index.html
            echo '<html>' >> docs/simple/$pkg/index.html
            echo '  <body>' >> docs/simple/$pkg/index.html
            echo "    <a href=\"../../wheels/$fname\">$fname</a>" >> docs/simple/$pkg/index.html
            echo '  </body>' >> docs/simple/$pkg/index.html
            echo '</html>' >> docs/simple/$pkg/index.html
          done

      # ---------------------------------------------------------
      # Generate pdoc documentation
      # ---------------------------------------------------------
      - name: Generate pdoc docs
        run: |
          mkdir -p docs/pdoc
          pdoc --html --output-dir docs/pdoc mjrengo/src/mjrengo